# Builds the demo (pulsenyc-source/pulsenyc) and publishes it with GitHub Pages.
name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['pulsenyc-source/pulsenyc/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulsenyc-source/pulsenyc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rm -rf node_modules          # the committed node_modules is broken; install fresh
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pulsenyc-source/pulsenyc/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
